{% set name = "pytest-metadata" %}
{% set version = "2.0.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/pytest_metadata-{{ version }}.tar.gz
  sha256: fcc653f65fe3035b478820b5284fbf0f52803622ee3f60a2faed7a7d3ba1f41e

build:
  number: 0
  skip: true  # [py<3.7]
  script: pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - python
    - pip
    - poetry-core >=1.0.0
  run:
    - python
    - pytest >=3.0.0,<8.0.0

test:
  source_files:
    - tests
  imports:
    - pytest_metadata
  commands:
    - pip check
    - pytest -vv
  requires:
    - pip
    - pytest

about:
  home: https://github.com/pytest-dev/pytest-metadata
  license: MPL-2.0
  license_family: OTHER
  license_file: LICENSE
  summary: pytest plugin for test session metadata
  dev_url: https://github.com/pytest-dev/pytest-metadata
  doc_url: https://github.com/pytest-dev/pytest-metadata

extra:
  recipe-maintainers:
    - birdsarah
    - davehunt
    - nicoddemus
