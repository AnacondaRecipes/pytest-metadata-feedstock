{% set name = "pytest-metadata" %}
{% set version = "3.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|replace('-', '_') }}-{{ version }}.tar.gz
  sha256: d2a29b0355fbc03f168aa96d41ff88b1a3b44a3b02acbe491801c98a048017c8

build:
  number: 0
  skip: true  # [py<38]
  script: pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - python
    - pip
    - hatch-vcs >=0.3
    - hatchling >=1.13
  run:
    - python
    - pytest >=7.0.0

test:
  imports:
    - pytest_metadata
    - pytest_metadata.ci
  source_files:
    - tests/
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest -v tests/

about:
  home: https://github.com/pytest-dev/pytest-metadata
  license: MPL-2.0
  license_family: MOZILLA
  license_file: LICENSE
  summary: pytest plugin for test session metadata
  description: |
    pytest-metadata is a plugin for pytest that provides access to test session metadata.
  dev_url: https://github.com/pytest-dev/pytest-metadata
  doc_url: https://github.com/pytest-dev/pytest-metadata

extra:
  recipe-maintainers:
    - birdsarah
    - davehunt
    - nicoddemus
