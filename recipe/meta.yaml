{% set name = "pytest-metadata" %}
{% set version = "3.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pytest_metadata-{{ version }}.tar.gz
  sha256: d2a29b0355fbc03f168aa96d41ff88b1a3b44a3b02acbe491801c98a048017c8

build:
  number: 0
  script: pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  skip: true  # [py<38]

requirements:
  host:
    - python
    - hatch-vcs >=0.3
    - pip
    - hatchling >=1.13
  run:
    - python
    - pytest >=7.0.0

test:
  imports:
    - pytest_metadata
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/pytest-dev/pytest-metadata
  license: MPL-2.0
  license_family: OTHER
  license_file: LICENSE
  summary: pytest plugin for test session metadata
  dev_url: https://github.com/pytest-dev/pytest-metadata
  doc_url: https://github.com/pytest-dev/pytest-metadata

extra:
  recipe-maintainers:
    - birdsarah
    - davehunt
    - nicoddemus